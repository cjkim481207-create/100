<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#1d4e6f">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon-192.png">
<link rel="apple-touch-icon" href="/icon-192.png">
<title>사진대지 자동생성</title>
<style>
  :root{
    --bg:#eef0f2; --card:#fff; --ink:#16202a; --dim:#5d6b78; --line:#c9d1d8;
    --accent:#1d4e6f; --accent-ink:#fff; --danger:#a8321f;
  }
  @media (prefers-color-scheme:dark){
    :root{ --bg:#171b1f; --card:#20262c; --ink:#e6ebef; --dim:#94a3b0; --line:#39424b;
           --accent:#4d90b8; --accent-ink:#0e1418; }
  }
  :root[data-theme="light"]{ --bg:#eef0f2; --card:#fff; --ink:#16202a; --dim:#5d6b78; --line:#c9d1d8; --accent:#1d4e6f; --accent-ink:#fff; }
  :root[data-theme="dark"]{ --bg:#171b1f; --card:#20262c; --ink:#e6ebef; --dim:#94a3b0; --line:#39424b; --accent:#4d90b8; --accent-ink:#0e1418; }

  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
       font:16px/1.5 "Malgun Gothic","맑은 고딕",-apple-system,"Noto Sans KR",sans-serif}
  .wrap{max-width:760px;margin:0 auto;padding:0 12px 48px}

  header{background:var(--accent);color:var(--accent-ink);padding:14px 16px;margin-bottom:14px}
  header h1{margin:0;font-size:17px;letter-spacing:.02em}
  header p{margin:2px 0 0;font-size:12.5px;opacity:.85}

  .panel{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:14px}
  .grid{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
  label{display:block;font-size:12px;color:var(--dim);letter-spacing:.04em;margin-bottom:3px}
  input{width:100%;padding:9px 10px;font:inherit;font-size:15px;color:var(--ink);
        background:transparent;border:1px solid var(--line);border-radius:7px}
  input:focus{outline:2px solid var(--accent);outline-offset:-1px}

  .pick{display:block;margin-top:12px;padding:14px;text-align:center;font-weight:700;
        background:var(--accent);color:var(--accent-ink);border-radius:8px;cursor:pointer}
  .hint{font-size:12.5px;color:var(--dim);margin:10px 0 0}

  .card{display:flex;gap:10px;align-items:flex-start;background:var(--card);
        border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:8px;position:relative}
  .thumb{width:72px;height:72px;border-radius:6px;flex:none;border:1px solid var(--line)}
  .fields{flex:1;min-width:0;display:grid;gap:6px}
  .fields input{padding:7px 9px;font-size:14px}
  .no{font-size:11.5px;color:var(--dim);letter-spacing:.06em}
  .del{position:absolute;top:6px;right:6px;width:26px;height:26px;border:0;border-radius:6px;
       background:transparent;color:var(--danger);font-size:15px;cursor:pointer}

  #actions{display:none;gap:10px;position:sticky;bottom:0;padding:12px 0 4px;
           background:linear-gradient(to top,var(--bg) 70%,transparent)}
  #actions button{flex:1;padding:15px;font:inherit;font-size:15.5px;font-weight:700;
                  border:1px solid var(--accent);border-radius:9px;cursor:pointer}
  #btnShareXlsx{background:var(--accent);color:var(--accent-ink)}
  #btnSharePdf{background:transparent;color:var(--accent)}
  #actions button.rdy{background:#1c7a4a;border-color:#1c7a4a;color:#fff}
  #saves{display:none;gap:8px;align-items:center;justify-content:center;padding-bottom:8px}
  #saves span{font-size:12px;color:var(--dim)}
  #saves button{padding:6px 12px;font:inherit;font-size:12.5px;color:var(--dim);
                background:transparent;border:1px solid var(--line);border-radius:6px;cursor:pointer}
  button:disabled{opacity:.5}
  #status{min-height:20px;font-size:13.5px;color:var(--dim);text-align:center;padding:2px 0}

  .sec{font-size:12px;color:var(--dim);letter-spacing:.08em;margin:18px 0 8px}
  #preview canvas{display:block;width:100%;margin-bottom:10px;border:1px solid var(--line);
                  border-radius:4px;background:#fff}
  #empty{color:var(--dim);text-align:center;padding:26px 10px;font-size:14px}
</style>
</head>
<body>
<header>
  <h1>사진대지 자동생성</h1>
  <p>사진을 넣으면 현장 양식에 맞춰 엑셀·PDF로 만들어 줍니다</p>
</header>

<div class="wrap">
  <div class="panel">
    <div class="grid">
      <div style="grid-column:1/-1"><label for="f_site">현장명</label><input id="f_site"></div>
      <div><label for="f_loc">위치 (새 사진 기본값)</label><input id="f_loc" placeholder="구리갈매A-2BL 현장내"></div>
      <div><label for="f_memo">내용 (새 사진 기본값)</label><input id="f_memo" placeholder="가배수로 정리"></div>
      <div><label for="f_date">일자</label><input id="f_date" type="date"></div>
    </div>
    <label class="pick">사진 추가 (여러 장 선택 가능)
      <input id="pick" type="file" accept="image/*" multiple hidden>
    </label>
    <p class="hint">갤러리에서 사진 여러 장을 선택해 <b>공유 → 사진대지</b>로 보내면 바로 채워집니다.
      먼저 브라우저 메뉴에서 <b>홈 화면에 추가</b>를 한 번 해 두세요.</p>
  </div>

  <div id="list"></div>
  <div id="empty">아직 사진이 없습니다. [사진 추가]를 누르거나 갤러리에서 공유하세요.</div>

  <div id="actions">
    <button id="btnShareXlsx" type="button">엑셀 공유</button>
    <button id="btnSharePdf" type="button">PDF 공유</button>
  </div>
  <div id="saves">
    <span>저장만 하기</span>
    <button id="btnXlsx" type="button">엑셀(xlsx)</button>
    <button id="btnPdf" type="button">PDF</button>
  </div>
  <div id="status"></div>

  <div class="sec" id="pvLabel">미리보기 (실제 출력 모양)</div>
  <div id="preview"></div>
</div>

<script src="/app.js"></script>
</body>
</html>

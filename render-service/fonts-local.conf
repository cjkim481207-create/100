<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- 양식이 쓰는 마이크로소프트 글꼴을 무료 대체 글꼴로 못박는다.
     지정하지 않으면 LibreOffice 가 제멋대로 고른 글꼴(대개 굵어 보인다)로 그리고,
     무엇보다 '기본 글꼴'이 달라지면 엑셀의 열 너비 계산이 통째로 틀어져 표 폭이 달라진다.
     Carlito=Calibri, Liberation Sans=Arial 는 글자 폭이 원본과 똑같이 설계된 글꼴이다. -->
<fontconfig>

  <!-- ── 라틴: 폭이 동일한 대체 글꼴 ─────────────────────────────── -->
  <match target="pattern">
    <test name="family"><string>Calibri</string></test>
    <edit name="family" mode="assign" binding="same"><string>Carlito</string></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>Arial</string></test>
    <edit name="family" mode="assign" binding="same"><string>Liberation Sans</string></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>Times New Roman</string></test>
    <edit name="family" mode="assign" binding="same"><string>Liberation Serif</string></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>Courier New</string></test>
    <edit name="family" mode="assign" binding="same"><string>Liberation Mono</string></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>Cambria</string></test>
    <edit name="family" mode="assign" binding="same"><string>Caladea</string></edit>
  </match>

  <!-- ── 한글: 맑은 고딕 계열 → Noto Sans KR ───────────────────── -->
  <match target="pattern">
    <test name="family"><string>Malgun Gothic</string></test>
    <edit name="family" mode="assign" binding="same"><string>Noto Sans KR</string></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>맑은 고딕</string></test>
    <edit name="family" mode="assign" binding="same"><string>Noto Sans KR</string></edit>
  </match>

  <!-- ── 한글: 굴림/돋움 계열 → 나눔고딕 (굴림에 가까운 무게) ───── -->
  <match target="pattern">
    <test name="family"><string>Gulim</string></test>
    <edit name="family" mode="assign" binding="same"><string>NanumGothic</string></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>굴림</string></test>
    <edit name="family" mode="assign" binding="same"><string>NanumGothic</string></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>GulimChe</string></test>
    <edit name="family" mode="assign" binding="same"><string>NanumGothicCoding</string></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>Gulimche</string></test>
    <edit name="family" mode="assign" binding="same"><string>NanumGothicCoding</string></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>굴림체</string></test>
    <edit name="family" mode="assign" binding="same"><string>NanumGothicCoding</string></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>새굴림</string></test>
    <edit name="family" mode="assign" binding="same"><string>NanumGothic</string></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>Dotum</string></test>
    <edit name="family" mode="assign" binding="same"><string>NanumGothic</string></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>돋움</string></test>
    <edit name="family" mode="assign" binding="same"><string>NanumGothic</string></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>Batang</string></test>
    <edit name="family" mode="assign" binding="same"><string>NanumMyeongjo</string></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>바탕</string></test>
    <edit name="family" mode="assign" binding="same"><string>NanumMyeongjo</string></edit>
  </match>

  <!-- 한글이 없는 글꼴로 한글을 그릴 때 이어붙일 글꼴 -->
  <match target="pattern">
    <test name="lang" compare="contains"><string>ko</string></test>
    <edit name="family" mode="append" binding="weak"><string>Noto Sans KR</string></edit>
  </match>

</fontconfig>

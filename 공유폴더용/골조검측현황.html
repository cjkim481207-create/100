<title>골조 검측 현황판</title>

    --border:#d6dde6; --accent:#245b96; --accent-soft:#e4edf7;
    --done:#1c9257; --done-bg:#e6f4ec; --done-bd:#b6e0c7;

    padding:11px 14px;font-size:12.5px;display:none;line-height:1.7}

  .editbar{margin-top:12px;display:none;flex-wrap:wrap;gap:8px;align-items:center}
  body.editing .editbar{display:flex}
  .applyall{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted);font-weight:600}

  .cell .memo-line{font-size:11px;color:var(--muted);line-height:1.45;white-space:pre-wrap;
    overflow-wrap:anywhere;word-break:keep-all;border-top:1px dashed var(--border);padding-top:3px;margin-top:1px}

  .cell.done .date{color:var(--done);font-weight:700}
  .cell.part{background:var(--part-bg);border-color:var(--part-bd)}
  .cell.part .dot{background:var(--part)}
  .cell.part .date{color:var(--part);font-weight:700}
  .cell .x{position:absolute;top:-7px;right:-7px;display:none;z-index:2}
  body.editing .cell .x{display:block}
  body.editing .cell{cursor:grab;padding-left:20px}
  body.editing .cell::before{content:"⠿";position:absolute;left:6px;top:50%;transform:translateY(-50%);
    font-size:12px;color:var(--muted);opacity:.7;line-height:1}
  .cell.dragging{opacity:.35}
  .cell.over-l{box-shadow:inset 3px 0 0 var(--accent)}
  .cell.over-r{box-shadow:inset -3px 0 0 var(--accent)}

  .slot{border:1px dashed var(--border);border-radius:var(--r);min-height:54px;display:flex;
    align-items:center;justify-content:center;color:var(--muted);font-size:18px;font-weight:700;
    background:transparent;cursor:pointer;padding:0}
  .slot:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
  .slot.blank{border:none;cursor:default;pointer-events:none}
  .slot.over{border-color:var(--accent);border-style:solid;background:var(--accent-soft)}

  .addfloor{margin-top:8px;display:none}
  body.editing .addfloor{display:block}
  footer{margin-top:24px;color:var(--muted);font-size:12.5px;text-align:center;line-height:1.75}

  dialog{border:1px solid var(--border);border-radius:14px;padding:0;width:min(460px,94vw);
    background:var(--surface);color:var(--text);box-shadow:var(--shadow)}
  dialog::backdrop{background:rgba(10,15,22,.5)}
  .m-head{padding:16px 18px 6px}
  .m-head h3{margin:0;font-size:16px}
  .m-head p{margin:4px 0 0;font-size:12.5px;color:var(--muted)}
  .m-body{padding:10px 18px 18px;display:flex;flex-direction:column;gap:14px;max-height:70vh;overflow-y:auto}
  .sec-cap{font-size:12px;font-weight:800;color:var(--muted);letter-spacing:.04em;margin-bottom:7px}
  .namerow{display:flex;gap:8px}
  .namerow input{flex:1}
  .nameIn{font:inherit;font-size:14px;font-weight:700;padding:9px 11px;border-radius:9px;
    border:1px solid var(--border);background:var(--surface-2);color:var(--text);width:100%}
  .quick{display:flex;flex-wrap:wrap;gap:6px;margin-top:7px}
  .qbtn{font:inherit;font-size:12px;font-weight:700;padding:4px 10px;border-radius:99px;cursor:pointer;
    border:1px solid var(--border);background:var(--surface-2);color:var(--muted)}
  .qbtn:hover{border-color:var(--accent);color:var(--accent)}
  .pour{display:grid;grid-template-columns:38px 132px 1fr 22px;gap:6px;align-items:center;margin-bottom:6px}
  .pour .n{font-size:12.5px;font-weight:800;color:var(--muted)}
  .pour input{font:inherit;font-size:13px;padding:8px 9px;border-radius:8px;border:1px solid var(--border);
    background:var(--surface-2);color:var(--text);width:100%;min-width:0}
  textarea{font:inherit;font-size:13px;padding:9px 10px;border-radius:9px;border:1px solid var(--border);
    background:var(--surface-2);color:var(--text);width:100%;resize:vertical;min-height:60px}
  .m-actions{display:flex;gap:8px}
  .btn{font:inherit;font-weight:700;cursor:pointer;border-radius:9px;padding:10px 12px;
    border:1px solid var(--border);background:var(--surface-2);color:var(--text);flex:1}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  .btn.ghost{flex:none;color:var(--muted)}
  .btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

  try { backup = JSON.parse(localStorage.getItem(LSKEY)); } catch(e){}

  var dirty=false, editing=false, curB=0, draft=null, target=null, drag=null;

  var el = { tabs:$("#tabs"), building:$("#building"), dlg:$("#dlg"),
             pours:$("#pours"), memo:$("#memo"), saveState:$("#saveState"),
             foot:$("#foot"), banner:$("#recoverBanner") };

  function fmt(d){ if(!d) return ""; var p=d.split("-"); return p[0].slice(2)+"."+p[1]+"."+p[2]; }
  function stamp(t){ if(!t) return "";
    var d=new Date(t), z=function(n){ return n<10?"0"+n:""+n; };
    return d.getFullYear()+"-"+z(d.getMonth()+1)+"-"+z(d.getDate())+" "+z(d.getHours())+":"+z(d.getMinutes()); }

  function markDirty(){
    dirty = true; data.savedAt = Date.now();
    try{ localStorage.setItem(LSKEY, JSON.stringify(data)); }catch(e){}
    paintState();
  }
  function paintState(){
    el.saveState.className = "savestate" + (dirty ? " dirty" : "");
    el.saveState.textContent = dirty ? "● 저장 안 됨"
      : (data.savedAt ? "최종 저장 " + stamp(data.savedAt) + (data.savedBy ? " · " + data.savedBy : "") : "");
    el.foot.innerHTML = "데이터는 이 HTML 파일 안에 함께 저장됩니다 · 서버·인터넷 불필요<br>"
      + "<b>✎ 편집</b> 또는 칸 입력 → <b>💾 저장</b> → 내려받은 파일로 <b>공유폴더 파일 교체</b>";
  }

  /* ---------- 상태 계산 ---------- */
  function stateOf(c){
    if(!c || !c.pours || !c.pours.length) return {st:"none",k:0,n:0,last:""};
    var n=c.pours.length, ds=c.pours.filter(function(p){return p.d;}).map(function(p){return p.d;}).sort();
    return { st: ds.length===0?"none":(ds.length===n?"done":"part"), k:ds.length, n:n, last: ds.length?ds[ds.length-1]:"" };
  }
  function labelOf(c){
    var s=stateOf(c);
    if(s.st==="none") return "미완";
    if(s.st==="done") return s.n>1 ? (s.n+"차 완료 · "+fmt(s.last)) : fmt(s.last);
    return s.k+"/"+s.n+"차 · "+fmt(s.last);
  }
  function hasMemo(c){
    if(!c) return false;
    if(c.memo && c.memo.trim()) return true;
    return (c.pours||[]).some(function(p){ return p.m && p.m.trim(); });
  }
  function statsOf(b){
    var total=0, done=0;
    (b.floors||[]).forEach(function(f){
      (f.cells||[]).forEach(function(c){ total++; if(stateOf(c).st==="done") done++; });
    });
    return {done:done,total:total,pct: total?Math.round(done/total*100):0};
  }
  function maxCols(b){
    var m=1; (b.floors||[]).forEach(function(f){ m=Math.max(m,(f.cells||[]).length); }); return m;
  }

  /* 칸 내용 그리기 — 차수는 1차·2차·3차 모두 그대로 표시(생략 없음) */
  function span(cls, txt){
    var e = document.createElement("span"); e.className = cls; e.textContent = txt; return e;
  }
  function fillCell(d, c){
    d.textContent = "";
    var head = document.createElement("span"); head.className = "name";
    head.appendChild(span("dot",""));
    head.appendChild(span("nm", c.name));
    d.appendChild(head);

    var ps = c.pours || [];
    if(ps.length <= 1){
      var p0 = ps[0];
      d.appendChild(span("date", (p0 && p0.d) ? fmt(p0.d) : "미완"));
      if(p0 && p0.m && p0.m.trim()){
        var one = document.createElement("div"); one.className = "memo-line";
        one.textContent = p0.m.trim(); d.appendChild(one);
      }
    } else {
      var list = document.createElement("div"); list.className = "plist";
      ps.forEach(function(p,pi){
        var r = document.createElement("div");
        r.className = "prow " + (p.d ? "ok" : "no");
        r.appendChild(span("pn", (pi+1) + "차"));
        r.appendChild(span("pd", p.d ? fmt(p.d) : "미완"));
        r.appendChild(span("pm", (p.m || "").trim()));
        list.appendChild(r);
      });
      d.appendChild(list);
    }
    if(c.memo && c.memo.trim()){
      var ml = document.createElement("div"); ml.className = "memo-line";
      ml.textContent = c.memo.trim(); d.appendChild(ml);
    }
  }

  /* ---------- 드래그 이동 ---------- */
  function moveCell(from, to){                 /* {f:층index, c:칸index} */
    var fl = data.buildings[curB].floors;
    if(from.f===to.f && from.c===to.c) return;
    var cell = fl[from.f].cells.splice(from.c,1)[0];
    if(!cell) return;
    var idx = to.c;
    if(from.f===to.f && from.c < to.c) idx--;   /* 같은 줄 오른쪽 이동 보정 */
    idx = Math.max(0, Math.min(idx, fl[to.f].cells.length));
    fl[to.f].cells.splice(idx, 0, cell);
    markDirty(); render();
  }
  function clearDropMarks(){
    var n = el.building.querySelectorAll(".over-l,.over-r,.slot.over");
    for(var i=0;i<n.length;i++) n[i].classList.remove("over-l","over-r","over");
  }

  /* ---------- 렌더 ---------- */
  function render(){
    if(curB >= data.buildings.length) curB = Math.max(0, data.buildings.length-1);
    var b = data.buildings[curB];
    if(!b) return;

    $("#pageTitle").hidden = editing;
    $("#titleInput").hidden = !editing;
    $("#pageTitle").textContent = data.title || "골조 검측 현황판";
    $("#titleInput").value = data.title || "";
    $("#applyAll").checked = data.applyAll !== false;

    /* 탭 */
    el.tabs.innerHTML = "";
    data.buildings.forEach(function(bd,idx){
      var t = document.createElement("div");
      t.className = "tab" + (idx===curB ? " sel" : ""); t.tabIndex = 0;
      if(editing){
        var inp = document.createElement("input");
        inp.value = bd.name; inp.setAttribute("aria-label","동 이름");
        inp.oninput = function(){ bd.name = inp.value; markDirty(); };
        inp.onclick = function(e){ e.stopPropagation(); };
        t.appendChild(inp);
        if(data.buildings.length > 1){
          var x = document.createElement("button");
          x.className="x"; x.textContent="×"; x.title="이 동 삭제";
          x.onclick = function(e){
            e.stopPropagation();
            if(!confirm("'"+bd.name+"' 전체를 삭제할까요? 입력된 일자·메모도 함께 지워집니다.")) return;
            data.buildings.splice(idx,1);
            if(curB>=data.buildings.length) curB=data.buildings.length-1;
            markDirty(); render();
          };
          t.appendChild(x);
        }
      } else {
        var s = statsOf(bd);
        t.innerHTML = '<span class="tname"></span><span class="tpct">'+s.pct+'%</span>';
        t.querySelector(".tname").textContent = bd.name;
      }
      t.onclick = function(){ curB = idx; render(); };
      t.onkeydown = function(e){ if(e.key==="Enter"||e.key===" "){ e.preventDefault(); curB=idx; render(); } };
      el.tabs.appendChild(t);
    });
    if(editing){
      var addB = document.createElement("button");
      addB.className="add"; addB.textContent="＋ 동 추가";
      addB.onclick = function(){
        var src = data.buildings[curB];
        var fl = (src ? src.floors : []).map(function(f){
          return { id:f.id, name:f.name, cells:(f.cells||[]).map(function(c){ return newCell(c.name); }) };
        });
        data.buildings.push({id:nid("b"), name:"새 동", floors:fl});
        curB = data.buildings.length-1; markDirty(); render();
      };
      el.tabs.appendChild(addB);
    }

    /* 진행률 */
    var st = statsOf(b);
    $("#pct").textContent = st.pct + "%";
    $("#barFill").style.width = st.pct + "%";
    var all = data.buildings.reduce(function(a,bd){ var s=statsOf(bd); a.d+=s.done; a.t+=s.total; return a; },{d:0,t:0});
    $("#progLabel").textContent = b.name+" "+st.done+" / "+st.total+" 칸 완료   ·   전체 "
      + all.d+" / "+all.t+" ("+(all.t?Math.round(all.d/all.t*100):0)+"%)";

    /* 건물 */
    var cols = maxCols(b) + (editing ? 1 : 0);
    el.building.innerHTML = "";
    b.floors.forEach(function(f,fi){
      var row = document.createElement("div"); row.className="floor";

      var badge = document.createElement("div"); badge.className="floor-badge";
      if(editing){
        var finp = document.createElement("input"); finp.value=f.name; finp.setAttribute("aria-label","층 이름");
        finp.oninput = function(){
          if(data.applyAll!==false) data.buildings.forEach(function(bd){ if(bd.floors[fi]) bd.floors[fi].name=finp.value; });
          else f.name = finp.value;
          markDirty();
        };
        badge.appendChild(finp);
        var fx = document.createElement("button"); fx.className="x"; fx.textContent="×"; fx.title="이 층 삭제";
        fx.onclick = function(){
          if(!confirm("'"+f.name+"' 층을 삭제할까요?")) return;
          var targets = (data.applyAll!==false) ? data.buildings : [b];
          targets.forEach(function(bd){ if(bd.floors[fi]) bd.floors.splice(fi,1); });
          markDirty(); render();
        };
        badge.appendChild(fx);
      } else {
        var lv = document.createElement("div"); lv.className="lv"; lv.textContent=f.name; badge.appendChild(lv);
      }

      var items = document.createElement("div"); items.className="items";
      items.style.setProperty("--cols", cols);

      (f.cells||[]).forEach(function(c,ci){
        var s = stateOf(c);
        var d = document.createElement("div");
        d.className = "cell" + (s.st==="done"?" done":s.st==="part"?" part":"");
        d.tabIndex = 0; d.setAttribute("role","button");
        fillCell(d, c);
        d.title = b.name+" "+f.name+" "+c.name+" · "+labelOf(c);

        d.onclick = function(){ openDlg(fi,ci); };
        d.onkeydown = function(e){
          if(editing && e.ctrlKey){
            var to = null;
            if(e.key==="ArrowLeft")  to = {f:fi, c:Math.max(0,ci-1)};
            if(e.key==="ArrowRight") to = {f:fi, c:Math.min((f.cells.length), ci+2)};
            if(e.key==="ArrowUp" && fi>0) to = {f:fi-1, c:Math.min(ci, b.floors[fi-1].cells.length)};
            if(e.key==="ArrowDown" && fi<b.floors.length-1) to = {f:fi+1, c:Math.min(ci, b.floors[fi+1].cells.length)};
            if(to){ e.preventDefault(); moveCell({f:fi,c:ci}, to); return; }
          }
          if(e.key==="Enter"||e.key===" "){ e.preventDefault(); openDlg(fi,ci); }
        };

        if(editing){
          d.draggable = true;
          d.ondragstart = function(ev){
            drag = {f:fi,c:ci};
            d.classList.add("dragging");
            try{ ev.dataTransfer.effectAllowed="move"; ev.dataTransfer.setData("text/plain","cell"); }catch(err){}
          };
          d.ondragend = function(){ d.classList.remove("dragging"); drag=null; clearDropMarks(); };
          d.ondragover = function(ev){
            if(!drag) return;
            ev.preventDefault(); ev.dataTransfer.dropEffect="move";
            var r = d.getBoundingClientRect(), left = (ev.clientX - r.left) < r.width/2;
            d.classList.toggle("over-l", left); d.classList.toggle("over-r", !left);
          };
          d.ondragleave = function(){ d.classList.remove("over-l","over-r"); };
          d.ondrop = function(ev){
            ev.preventDefault(); ev.stopPropagation();
            if(!drag) return;
            var r = d.getBoundingClientRect(), left = (ev.clientX - r.left) < r.width/2;
            var from = drag; drag = null;
            moveCell(from, {f:fi, c: left ? ci : ci+1});
          };
          var cx = document.createElement("button");
          cx.className="x"; cx.textContent="×"; cx.title="이 칸 삭제";
          cx.onclick = function(ev){
            ev.stopPropagation();
            if(!confirm("'"+c.name+"' 칸을 삭제할까요? 입력된 일자·메모도 함께 지워집니다.")) return;
            f.cells.splice(ci,1); markDirty(); render();
          };
          d.appendChild(cx);
        }
        items.appendChild(d);
      });

      if(editing){
        var plus = document.createElement("button");
        plus.className="slot"; plus.textContent="＋"; plus.title="이 층에 칸 추가";
        plus.onclick = function(){
          f.cells.push(newCell("새 칸"));
          markDirty(); render();
          openDlg(fi, f.cells.length-1);
        };
        plus.ondragover = function(ev){ if(!drag) return; ev.preventDefault(); plus.classList.add("over"); };
        plus.ondragleave = function(){ plus.classList.remove("over"); };
        plus.ondrop = function(ev){
          ev.preventDefault(); if(!drag) return;
          var from = drag; drag = null;
          moveCell(from, {f:fi, c:f.cells.length});
        };
        items.appendChild(plus);
      }
      var fillers = cols - (f.cells||[]).length - (editing?1:0);
      for(var k=0;k<fillers;k++){
        var bl = document.createElement("div"); bl.className="slot blank"; items.appendChild(bl);
      }

      row.appendChild(badge); row.appendChild(items);
      el.building.appendChild(row);
    });

    paintState();
  }

  /* ---------- 칸 입력 다이얼로그 ---------- */
  function openDlg(fi,ci){
    var b = data.buildings[curB], f = b.floors[fi], c = f.cells[ci];
    if(!c) return;
    target = {f:fi, c:ci};
    draft = JSON.parse(JSON.stringify(c));
    if(!draft.pours || !draft.pours.length) draft.pours = [{d:"",m:""}];
    $("#dlgTitle").textContent = b.name + " · " + f.name;
    $("#nameIn").value = draft.name || "";
    el.memo.value = draft.memo || "";
    var q = $("#quick"); q.innerHTML = "";
    (data.defaults||[]).forEach(function(n){
      var qb = document.createElement("button"); qb.className="qbtn"; qb.textContent=n;
      qb.onclick = function(){ $("#nameIn").value = n; };
      q.appendChild(qb);
    });
    renderPours();
    el.dlg.showModal();
    setTimeout(function(){ $("#nameIn").focus(); },30);
  }
  function renderPours(){
    el.pours.innerHTML = "";
    draft.pours.forEach(function(p,pi){
      var row = document.createElement("div"); row.className="pour";
      var n = document.createElement("span"); n.className="n"; n.textContent=(pi+1)+"차";
      var d = document.createElement("input"); d.type="date"; d.value=p.d||"";
      d.setAttribute("aria-label",(pi+1)+"차 검측완료 일자");
      d.oninput = function(){ p.d = d.value; };
      var m = document.createElement("input"); m.type="text"; m.value=p.m||"";
      m.placeholder = "구간·비고"; m.setAttribute("aria-label",(pi+1)+"차 비고");
      m.oninput = function(){ p.m = m.value; };
      row.appendChild(n); row.appendChild(d); row.appendChild(m);
      if(draft.pours.length>1){
        var x = document.createElement("button"); x.className="x"; x.textContent="×"; x.title="이 차수 삭제";
        x.onclick = function(){ draft.pours.splice(pi,1); renderPours(); };
        row.appendChild(x);
      } else { row.appendChild(document.createElement("span")); }
      el.pours.appendChild(row);
    });
  }
  $("#addPour").onclick = function(){ draft.pours.push({d:"",m:""}); renderPours(); };
  $("#okBtn").onclick = function(){
    var b = data.buildings[curB], c = b.floors[target.f].cells[target.c];
    if(!c){ el.dlg.close(); return; }
    c.name = ($("#nameIn").value || "").trim() || c.name;
    c.memo = el.memo.value;
    c.pours = draft.pours.filter(function(p){ return p.d || (p.m && p.m.trim()); });
    markDirty(); render(); el.dlg.close();
  };
  $("#clrBtn").onclick = function(){
    if(!confirm("이 칸의 일자·차수·메모를 지울까요? (이름은 유지됩니다)")) return;
    var c = data.buildings[curB].floors[target.f].cells[target.c];
    if(c){ c.pours=[]; c.memo=""; }
    markDirty(); render(); el.dlg.close();
  };
  $("#cxlBtn").onclick = function(){ el.dlg.close(); };

  /* ---------- 편집 ---------- */
  $("#editToggle").onclick = function(){
    editing = !editing;
    document.body.classList.toggle("editing", editing);
    this.classList.toggle("on", editing);
    this.textContent = editing ? "✓ 편집 완료" : "✎ 편집";
    render();
  };
  $("#titleInput").oninput = function(){ data.title = this.value; markDirty(); };
  $("#applyAll").onchange = function(){ data.applyAll = this.checked; markDirty(); };
  $("#addFloorBtn").onclick = function(){
    var id = nid("f");
    var defs = data.defaults || ["기둥"];
    var targets = (data.applyAll!==false) ? data.buildings : [data.buildings[curB]];
    targets.forEach(function(bd){
      bd.floors.push({id:id, name:"새 층", cells: defs.map(function(d){ return newCell(d); })});
    });
    markDirty(); render();
  };
  $("#addAllBtn").onclick = function(){
    var name = (prompt("모든 층에 추가할 칸 이름을 적어주세요.","TG보") || "").trim();
    if(!name) return;
    data.buildings[curB].floors.forEach(function(f){ f.cells.push(newCell(name)); });
    if(data.defaults.indexOf(name) < 0) data.defaults.push(name);
    markDirty(); render();
  };

  /* ---------- 저장(파일 내보내기) ---------- */
  function buildHTML(){
    var css = $("#appcss").textContent;
    var js  = $("#appjs").textContent;
    var json = JSON.stringify(data).replace(/</g, "\\u003c");
    var close = "<" + "/script>";
    var title = (data.title || "골조 검측 현황판").replace(/[<>&]/g,"");
    return "<!doctype html>\n<html lang=\"ko\">\n<head>\n<meta charset=\"utf-8\">\n"
      + "<meta name=\"viewport\" content=\"width=device-width,initial-scale=1\">\n"
      + "<title>" + title + "</title>\n"
      + "<style id=\"appcss\">" + css + "</style>\n</head>\n<body>\n"
      + "<script id=\"data\" type=\"application/json\">\n" + json + "\n" + close + "\n"
      + "<div id=\"app\"></div>\n"
      + "<script id=\"appjs\">\n" + js + "\n" + close + "\n"
      + "</body>\n</html>";
  }
  function fileName(){
    var d=new Date(), z=function(n){ return n<10?"0"+n:""+n; };
    return "골조검측현황_"+d.getFullYear()+z(d.getMonth()+1)+z(d.getDate())+"_"+z(d.getHours())+z(d.getMinutes())+".html";
  }

  $("#saveBtn").onclick = async function(){
    var who = localStorage.getItem("gj_user") || "";
    if(!who){
      who = (prompt("저장하는 분 이름을 적어주세요. (누가 마지막에 고쳤는지 기록됩니다)","") || "").trim();
      if(who) localStorage.setItem("gj_user", who);
    }
    data.savedBy = who || data.savedBy || "";
    data.savedAt = Date.now();
    try{ localStorage.setItem(LSKEY, JSON.stringify(data)); }catch(e){}

    var html = buildHTML(), saved = false;
    if(window.showSaveFilePicker){
      try{
        var h = await window.showSaveFilePicker({
          suggestedName: fileName(),
          types:[{description:"HTML 파일", accept:{"text/html":[".html"]}}]
        });
        var w = await h.createWritable();
        await w.write(new Blob([html],{type:"text/html;charset=utf-8"}));
        await w.close(); saved = true;
      }catch(err){ if(err && err.name==="AbortError") return; }
    }
    if(!saved){
      var a = document.createElement("a");
      a.href = URL.createObjectURL(new Blob([html],{type:"text/html;charset=utf-8"}));
      a.download = fileName();
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(function(){ URL.revokeObjectURL(a.href); },2000);
    }
    dirty=false; paintState(); el.banner.hidden = true;
  };

  window.addEventListener("beforeunload", function(e){
    if(!dirty) return;
    e.preventDefault(); e.returnValue = "";
  });
  document.addEventListener("dragover", function(e){ if(drag) e.preventDefault(); });
  document.addEventListener("drop", function(e){ if(drag){ e.preventDefault(); drag=null; clearDropMarks(); } });

  /* ---------- 복구 배너 ---------- */
  if(backup && backup.docId===data.docId && (backup.savedAt||0) > (data.savedAt||0)){
    el.banner.hidden = false;
    el.banner.innerHTML = '<b>저장 안 된 수정본이 있습니다.</b> <span id="bkTime"></span><span class="sp"></span>'
      + '<button class="tbtn" id="bkUse">이 수정본 불러오기</button>'
      + '<button class="tbtn" id="bkDrop">무시 (파일 내용 사용)</button>';
    $("#bkTime").textContent = "이 컴퓨터에 " + stamp(backup.savedAt) + " 기준 백업이 남아 있습니다.";
    $("#bkUse").onclick = function(){ data = migrate(backup); el.banner.hidden=true; dirty=true; render(); };
    $("#bkDrop").onclick = function(){ try{ localStorage.removeItem(LSKEY); }catch(e){} el.banner.hidden=true; };
  }
  if(embErr){
    el.banner.hidden = false;
    el.banner.textContent = "파일에 저장된 데이터를 읽지 못했습니다. 이전 백업 파일을 사용하세요. (현재 화면은 기본값입니다)";
  }

  render();
})();
</script>

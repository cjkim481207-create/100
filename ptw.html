<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PTW 위험공종 사전작업허가서</title>
<style>
  *{box-sizing:border-box}
  body{font-family:"Malgun Gothic",sans-serif;margin:0;background:#eee;color:#111}
  .bar{background:#1a5;color:#fff;padding:10px 16px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;position:sticky;top:0}
  .bar h1{font-size:16px;margin:0;flex:1}
  .bar button{padding:8px 14px;border:0;border-radius:6px;cursor:pointer;font-size:14px}
  .b-print{background:#fff;color:#1a5;font-weight:700}
  .b-save{background:#0a4;color:#fff}
  .b-load{background:#087;color:#fff}
  .sheet{background:#fff;max-width:800px;margin:16px auto;padding:24px;box-shadow:0 2px 8px rgba(0,0,0,.2)}
  h2{text-align:center;font-size:20px;margin:0 0 16px;letter-spacing:2px}
  table{width:100%;border-collapse:collapse;margin-bottom:12px}
  th,td{border:1px solid #333;padding:6px 8px;font-size:13px;vertical-align:middle}
  th{background:#f0f0f0;width:120px;text-align:center;white-space:nowrap}
  input,textarea,select{width:100%;border:0;font:inherit;padding:2px;background:transparent}
  input:focus,textarea:focus,select:focus{outline:1px solid #1a5;background:#f7fff9}
  textarea{resize:vertical;min-height:44px}
  .chk{display:inline-block;margin-right:12px;font-size:13px;white-space:nowrap}
  .sign td{height:56px}
  .note{font-size:11px;color:#666;text-align:center;margin-top:6px}
  @media print{.bar{display:none}body{background:#fff}.sheet{box-shadow:none;margin:0;max-width:none}}
</style>
</head>
<body>
<div class="bar">
  <h1>위험공종 사전작업허가서(PTW)</h1>
  <button class="b-save" onclick="save()">저장</button>
  <button class="b-load" onclick="load()">불러오기</button>
  <button class="b-print" onclick="window.print()">인쇄 / PDF저장</button>
</div>

<div class="sheet">
  <h2>사 전 작 업 허 가 서</h2>
  <table>
    <tr><th>공사명</th><td colspan="3"><input id="f_project" placeholder="○○아파트 건설공사"></td></tr>
    <tr><th>작업일자</th><td><input id="f_date" type="date"></td>
        <th>작업시간</th><td><input id="f_time" placeholder="08:00 ~ 17:00"></td></tr>
    <tr><th>작업위치</th><td><input id="f_loc" placeholder="지하 1층 A구역"></td>
        <th>작업인원</th><td><input id="f_ppl" placeholder="○명"></td></tr>
    <tr><th>작업내용</th><td colspan="3"><textarea id="f_work" placeholder="작업 상세 내용"></textarea></td></tr>
    <tr><th>협력업체</th><td><input id="f_sub" placeholder="○○건설"></td>
        <th>작업책임자</th><td><input id="f_mgr" placeholder="홍길동"></td></tr>
  </table>

  <table>
    <tr><th>위험공종<br>구분</th><td colspan="3" id="hazbox" style="text-align:left">
      <label class="chk"><input type="checkbox" data-haz> 고소작업</label>
      <label class="chk"><input type="checkbox" data-haz> 밀폐공간</label>
      <label class="chk"><input type="checkbox" data-haz> 화기작업</label>
      <label class="chk"><input type="checkbox" data-haz> 중량물양중</label>
      <label class="chk"><input type="checkbox" data-haz> 굴착작업</label>
      <label class="chk"><input type="checkbox" data-haz> 해체작업</label>
      <label class="chk"><input type="checkbox" data-haz> 전기작업</label>
      <label class="chk"><input type="checkbox" data-haz> 기타</label>
    </td></tr>
    <tr><th>위험요인</th><td colspan="3"><textarea id="f_risk" placeholder="추락, 협착, 감전 등"></textarea></td></tr>
    <tr><th>안전대책</th><td colspan="3"><textarea id="f_safe" placeholder="안전난간 설치, 안전대 착용, 감시자 배치 등"></textarea></td></tr>
    <tr><th>안전보호구</th><td colspan="3" style="text-align:left">
      <label class="chk"><input type="checkbox"> 안전모</label>
      <label class="chk"><input type="checkbox"> 안전화</label>
      <label class="chk"><input type="checkbox"> 안전대</label>
      <label class="chk"><input type="checkbox"> 보안경</label>
      <label class="chk"><input type="checkbox"> 방진마스크</label>
      <label class="chk"><input type="checkbox"> 귀마개</label>
    </td></tr>
  </table>

  <table class="sign">
    <tr><th>작성(협력사)</th><td></td><th>확인(안전관리자)</th><td></td><th>승인(현장소장)</th><td></td></tr>
  </table>
  <div class="note">본 허가서는 작업 전 관계자 서명 후 유효하며, LH COTIS에 첨부·등록합니다.</div>
</div>

<script>
const IDS=["f_project","f_date","f_time","f_loc","f_ppl","f_work","f_sub","f_mgr","f_risk","f_safe"];
function save(){
  const d={};IDS.forEach(i=>d[i]=document.getElementById(i).value);
  d.haz=[...document.querySelectorAll("#hazbox [data-haz]")].map(c=>c.checked);
  localStorage.setItem("ptw",JSON.stringify(d));
  alert("저장되었습니다.");
}
function load(){
  const s=localStorage.getItem("ptw");if(!s){alert("저장된 내용이 없습니다.");return;}
  const d=JSON.parse(s);IDS.forEach(i=>document.getElementById(i).value=d[i]||"");
  const hz=document.querySelectorAll("#hazbox [data-haz]");(d.haz||[]).forEach((v,k)=>{if(hz[k])hz[k].checked=v;});
}
window.onload=()=>{const t=document.getElementById("f_date");if(!t.value)t.value=new Date().toISOString().slice(0,10);};
</script>
</body>
</html>

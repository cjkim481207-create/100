<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#2255aa">
<link rel="manifest" href="manifest.webmanifest">
<title>사진대지 자동생성</title>
<style>
  *{box-sizing:border-box}
  body{font-family:"Malgun Gothic",sans-serif;margin:0;background:#eee;color:#111}
  .bar{background:#25a;color:#fff;padding:10px 14px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;position:sticky;top:0;z-index:9}
  .bar h1{font-size:16px;margin:0;flex:1}
  .bar button,.bar label.btn{padding:8px 14px;border:0;border-radius:6px;cursor:pointer;font-size:14px;background:#fff;color:#25a;font-weight:700}
  .head{background:#fff;max-width:800px;margin:14px auto;padding:14px;box-shadow:0 1px 5px rgba(0,0,0,.15)}
  .head input{border:1px solid #bbb;padding:6px;font:inherit;border-radius:4px;width:100%}
  .head .row{display:flex;gap:8px;margin-bottom:8px}
  .head .row>div{flex:2}
  .head .row>div.sm{flex:1}
  .head label{font-size:12px;color:#555}
  .tip{font-size:12px;color:#777}
  .page{background:#fff;max-width:800px;margin:0 auto 14px;padding:34px 30px;box-shadow:0 1px 5px rgba(0,0,0,.15)}
  .title{text-align:center;font-size:28px;font-weight:700;letter-spacing:14px;margin:0 0 10px}
  .site{font-size:14px;margin:0 0 12px}
  .ph{border:1px solid #333;height:330px;margin-bottom:8px;overflow:hidden;position:relative;display:flex;align-items:center;justify-content:center}
  .ph img{max-width:100%;max-height:328px;display:block;margin:auto}
  .del{position:absolute;top:4px;right:4px;background:#d33;color:#fff;border:0;border-radius:4px;padding:2px 8px;cursor:pointer;font-size:11px}
  table{width:100%;border-collapse:collapse;margin-bottom:18px}
  td,th{border:1px solid #333;font-size:13px;padding:5px 8px;height:30px}
  th{background:#fff;font-weight:700;width:64px;text-align:center;white-space:nowrap}
  td.v{width:42%}
  td input{width:100%;border:0;font:inherit;padding:2px;background:transparent}
  td input:focus{outline:1px solid #25a;background:#f5f8ff}
  .empty{max-width:800px;margin:30px auto;text-align:center;color:#888}
  @media print{
    .bar,.del,.empty,.head{display:none}
    body{background:#fff}
    .page{box-shadow:none;margin:0;max-width:none;page-break-after:always;padding:10px 4px}
  }
</style>
</head>
<body>
<div class="bar">
  <h1>사진대지 자동생성</h1>
  <label class="btn">사진 추가<input type="file" accept="image/*" multiple hidden onchange="add(this.files)"></label>
  <button onclick="window.print()">인쇄 / PDF저장</button>
</div>

<div class="head">
  <div class="row">
    <div><label>현장명</label><input id="h_site" value="구리갈매역세권 A-2BL 아파트 건설공사 3공구" oninput="draw()"></div>
    <div class="sm"><label>일자 (새 사진 기본값)</label><input id="h_date" type="date" onchange="draw()"></div>
  </div>
  <div class="row">
    <div><label>위치 (새 사진 기본값)</label><input id="h_loc" placeholder="예: 구리갈매A-2BL 현장내"></div>
    <div><label>내용 (새 사진 기본값)</label><input id="h_memo" placeholder="예: 가배수로 정리"></div>
  </div>
  <div class="tip">갤러리에서 사진 선택 → 공유 → [사진대지] 앱 선택하면 사진이 자동으로 들어옵니다. (최초 1회: 이 페이지를 크롬에서 열고 "홈 화면에 추가" 필요)</div>
</div>

<div id="pages"></div>
<div class="empty" id="empty">아직 사진이 없습니다. [사진 추가]를 누르거나, 갤러리에서 공유하세요.</div>

<script>
const items=[]; // {src, loc, memo, date, bigo}
const PER=2;
const $=id=>document.getElementById(id);
function addBlob(b){
  return new Promise(res=>{
    const r=new FileReader();
    r.onload=e=>{items.push({src:e.target.result,loc:$("h_loc").value,memo:$("h_memo").value,date:$("h_date").value,bigo:""});res();};
    r.readAsDataURL(b);
  });
}
async function add(files){for(const f of [...files])await addBlob(f);draw();}
function del(i){items.splice(i,1);draw();}
function set(i,k,v){items[i][k]=v;}
function esc(s){return (s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/"/g,"&quot;")}
function block(it,i){
  return `<div class="ph"><button class="del" onclick="del(${i})">삭제</button><img src="${it.src}"></div>
  <table>
    <tr><th>위 치</th><td class="v"><input value="${esc(it.loc)}" oninput="set(${i},'loc',this.value)"></td>
        <th>일 자</th><td><input type="date" value="${esc(it.date)}" onchange="set(${i},'date',this.value)"></td></tr>
    <tr><th>내 용</th><td class="v"><input value="${esc(it.memo)}" oninput="set(${i},'memo',this.value)"></td>
        <th>비 고</th><td><input value="${esc(it.bigo)}" oninput="set(${i},'bigo',this.value)"></td></tr>
  </table>`;
}
function draw(){
  const site=$("h_site").value;
  $("empty").style.display=items.length?"none":"block";
  let html="";
  for(let p=0;p<items.length;p+=PER){
    html+=`<div class="page"><div class="title">사  진  대  지</div><div class="site">현장명 : ${esc(site)}</div>`;
    for(let i=p;i<Math.min(p+PER,items.length);i++) html+=block(items[i],i);
    html+="</div>";
  }
  $("pages").innerHTML=html;
}
// 공유로 들어온 사진 불러오기 (서비스워커가 캐시에 저장해 둠)
async function loadShared(){
  if(!("caches" in window))return;
  const cache=await caches.open("shared");
  const c=await cache.match("count");
  if(!c)return;
  const n=+await c.text();
  for(let i=0;i<n;i++){
    const r=await cache.match("photo"+i);
    if(r)await addBlob(await r.blob());
  }
  await caches.delete("shared");
  draw();
}
window.onload=async()=>{
  if(!$("h_date").value)$("h_date").value=new Date().toISOString().slice(0,10);
  if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js");
  await loadShared();
  draw();
};
</script>
</body>
</html>
